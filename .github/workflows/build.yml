name: Build OpenWrt 25.12 for Cudy TR3600 v1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/openwrt/ccache
      CCACHE_COMPILERCHECK: content
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            config: tr3600.config
          - variant: full
            config: tr3600-full.config
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils-extra \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd curl ccache

      - name: Clone official OpenWrt 25.12
        run: |
          git clone --depth 1 -b openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          echo "OPENWRT_REV=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Restore OpenWrt download cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-openwrt-25.12-downloads-${{ hashFiles('config/**', 'patches/**', 'dts/**', 'packages/**', 'scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-25.12-downloads-

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: openwrt/ccache
          key: ${{ runner.os }}-openwrt-25.12-${{ matrix.variant }}-ccache-${{ hashFiles('config/**', 'patches/**', 'dts/**', 'packages/**', 'scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-25.12-${{ matrix.variant }}-ccache-

      - name: Add third-party proxy LuCI packages
        run: |
          echo "src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main" >> openwrt/feeds.conf.default
          git clone --depth 1 --filter=blob:none --sparse https://github.com/vernesong/OpenClash.git openclash
          git -C openclash sparse-checkout set luci-app-openclash
          cp -a openclash/luci-app-openclash openwrt/package/luci-app-openclash

      - name: Apply auditable Cudy TR3600 v1 patches & overlay
        run: |
          bash scripts/apply_patches.sh openwrt

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate and verify .config
        working-directory: openwrt
        run: |
          cp ../config/${{ matrix.config }} .config
          make defconfig
          ARCH=$(sed -n 's/^CONFIG_ARCH_PACKAGES="\(.*\)"$/\1/p' .config)
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPO_BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/ipk/${OPENWRT_REV}/${{ matrix.variant }}"
          mkdir -p files/etc/opkg
          {
            for FEED in base luci packages nikki; do
              echo "src/gz tr3600_${FEED} ${REPO_BASE}/packages/${ARCH}/${FEED}"
            done
            echo "src/gz tr3600_target ${REPO_BASE}/targets/mediatek/filogic/packages"
          } > files/etc/opkg/tr3600-extensionfeeds.conf
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y$' .config
          grep -q '^CONFIG_CCACHE=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-tr3600-fan=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-usb-net-rtl8152=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-usb-net-aqc111=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-app-openclash=m$' .config
          if [ "${{ matrix.variant }}" = "full" ]; then
            grep -q '^CONFIG_PACKAGE_nikki=y$' .config
            grep -q '^CONFIG_PACKAGE_luci-app-nikki=y$' .config
            grep -q '^CONFIG_PACKAGE_mihomo-meta=y$' .config
            grep -q '^CONFIG_PACKAGE_tailscale=y$' .config
            grep -q '^CONFIG_PACKAGE_luci-app-tailscale-community=y$' .config
          else
            ! grep -q '^CONFIG_PACKAGE_nikki=y$' .config
            ! grep -q '^CONFIG_PACKAGE_mihomo-meta=y$' .config
            ! grep -q '^CONFIG_PACKAGE_tailscale=y$' .config
          fi
          echo "Verified ${{ matrix.variant }} configuration"

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;

      - name: Compile firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Organize firmware artifacts
        run: |
          mkdir -p release-files
          OUT=openwrt/bin/targets/mediatek/filogic
          for FILE in "$OUT"/*cudy_tr3600-v1*.bin "$OUT"/*cudy_tr3600-v1*.manifest; do
            [ -e "$FILE" ] || continue
            NAME=$(basename "$FILE")
            case "$NAME" in
              *.bin) DEST="${NAME%.bin}-${{ matrix.variant }}.bin" ;;
              *.manifest) DEST="${NAME%.manifest}-${{ matrix.variant }}.manifest" ;;
            esac
            cp "$FILE" "release-files/$DEST"
          done
          cp "$OUT"/sha256sums "release-files/sha256sums-${{ matrix.variant }}" || true
          (cd release-files && sha256sum *.bin > "SHA256SUMS-${{ matrix.variant }}.txt")
          ls -lh release-files/

      - name: Organize matching extension package repository
        run: |
          REPO_ROOT="package-repo/ipk/${OPENWRT_REV}/${{ matrix.variant }}"
          OUT=openwrt/bin/targets/mediatek/filogic
          mkdir -p "$REPO_ROOT/targets/mediatek/filogic"
          cp -a openwrt/bin/packages "$REPO_ROOT/packages"
          cp -a "$OUT/packages" "$REPO_ROOT/targets/mediatek/filogic/packages"
          find "$REPO_ROOT" -name Packages.gz -o -name Packages.sig

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cudy-tr3600-v1-${{ matrix.variant }}-openwrt-25.12-${{ env.OPENWRT_REV }}
          path: release-files/

      - name: Upload extension package repository
        uses: actions/upload-artifact@v4
        with:
          name: cudy-tr3600-v1-${{ matrix.variant }}-ipk-${{ env.OPENWRT_REV }}
          path: package-repo/

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cudy-tr3600-v1-*-openwrt-25.12-*
          path: release-files
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="tr3600-25.12-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cudy TR3600 v1 — OpenWrt 25.12（标准版 + 完整版）" \
            --notes "标准版保留 LuCI、终端、风扇控制、USB 网卡驱动和诊断工具；完整版额外包含 Nikki、代理所需内核组件及 Tailscale。默认 LAN IP：\`192.168.10.1\`."

  pages:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download extension package repositories
        uses: actions/download-artifact@v4
        with:
          pattern: cudy-tr3600-v1-*-ipk-*
          path: package-repo
          merge-multiple: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: package-repo

      - name: Deploy extension package repository
        id: deployment
        uses: actions/deploy-pages@v4
